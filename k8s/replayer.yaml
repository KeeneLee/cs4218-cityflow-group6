# Send the prepared trips once.
apiVersion: batch/v1
kind: Job
metadata:
  name: cityflow-replay
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: cityflow-replay
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ocir-secret
      containers:
        - name: replayer
          image: cityflow-replayer:local
          envFrom:
            - configMapRef: { name: cityflow-kafka }
            - secretRef: { name: cityflow-kafka-auth }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
